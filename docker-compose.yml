services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incidentiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://incidentiq:incidentiq-local-password@host.docker.internal:3307/incidentiq
      QDRANT_URL: http://host.docker.internal:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incidentiq-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend