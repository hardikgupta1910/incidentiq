services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: incidentiq-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage



  mysql:
    image: mysql:8.4
    container_name: incidentiq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-local-password
      MYSQL_DATABASE: incidentiq
      MYSQL_USER: incidentiq
      MYSQL_PASSWORD: incidentiq-local-password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  qdrant_storage:
  mysql_data: